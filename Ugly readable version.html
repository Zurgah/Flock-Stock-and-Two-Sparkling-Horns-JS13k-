const POPCOUNT_TABLE = new Uint8Array(256);
for (let i = 0; i < 256; i++) POPCOUNT_TABLE[i] = (i&1)+POPCOUNT_TABLE[i>>1];

class Reader {
  constructor(b) { this.b = new DataView(b); this.pos = 0; this.l = b.byteLength; }
  u8() { return this.b.getUint8(this.pos++); }
  u16() { const v = this.b.getUint16(this.pos, 1); this.pos += 2; return v; }
  bytes(n) {
    if (this.pos + n > this.l) n = this.l - this.pos;
    if (n < 1) return new Uint8Array();
    this.pos += n;
    return new Uint8Array(this.b.buffer, this.b.byteOffset + this.pos - n, n);
  }
}

function unpackBits(d, c, b, o) {
  let buf = 0, ib = 0, i = 0, oi = 0, m = (1 << b) - 1;
  while (oi < c && i < d.length) {
    while (ib < b && i < d.length) buf = (buf << 8) | d[i++], ib += 8;
    if (ib >= b) ib -= b, o[oi++] = (buf >> ib) & m, buf &= (1 << ib) - 1;
  }
  return oi;
}

function applySymmetry(f, w, h) {
  for (let y = 0; y < h; y++)
    for (let x = 0, rs = y * w; x < w >> 1; x++) f[rs + w - 1 - x] = f[rs + x];
}

function decodeFrame(r, pf, w, h, pl, b, o) {
  const sym = r.u8(), t = r.u8(), tp = w * h, f = o || new Uint8Array(tp);
  if (t === 255) { pf ? f.set(pf) : f.fill(0); return f; }
  const d = r.bytes(r.u16());
  if (t === 0) {
    unpackBits(d, sym ? (w >> 1) * h : tp, b, f);
  } else if (t === 1) {
    f.fill(0);
    let p = 0, bi = 0, bb = 0, ib = 0, m = (1 << b) - 1;
    while (p < tp && bi < d.length) {
      while (ib < b && bi < d.length) bb = (bb << 8) | d[bi++], ib += 8;
      if (ib < b) break;
      ib -= b;
      const v = (bb >> ib) & m;
      bb &= (1 << ib) - 1;
      while (ib < 8 && bi < d.length) bb = (bb << 8) | d[bi++], ib += 8;
      if (ib < 8) break;
      ib -= 8;
      const c = (bb >> ib) & 255;
      bb &= (1 << ib) - 1;
      if (!c) break;
      const e = Math.min(p + c, tp);
      for (; p < e; f[p++] = v);
    }
  } else if (t === 2) {
    pf ? f.set(pf) : f.fill(0);
    const ms = d[0] | (d[1] << 8), m = d.subarray(2, 2 + ms), pk = d.subarray(2 + ms);
    let dc = 0;
    for (let i = 0; i < ms;) dc += POPCOUNT_TABLE[m[i++]];
    const ch = new Uint8Array(dc);
    unpackBits(pk, dc, b, ch);
    let ci = 0, pi = 0;
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const bx = pi >> 3, bt = 7 - (pi & 7);
        if (bx < ms && (m[bx] >> bt) & 1 && ci < dc) f[pi] = ch[ci++];
        pi++;
      }
  } else if (t === 3) {
    pf ? f.set(pf) : f.fill(0);
    const x0 = d[0] | (d[1] << 8), y0 = d[2] | (d[3] << 8);
    const x1 = d[4] | (d[5] << 8), y1 = d[6] | (d[7] << 8);
    const ps = d[8] | (d[9] << 8), pk = d.subarray(10, 10 + ps);
    const bw = x1 - x0 + 1, ix = new Uint8Array(bw * (y1 - y0 + 1));
    unpackBits(pk, bw * (y1 - y0 + 1), b, ix);
    let i = 0;
    for (let y = y0; y <= y1; y++) {
      const rs = y * w;
      for (let x = x0; x <= x1; x++) i < ix.length && (f[rs + x] = ix[i++]);
    }
  }
  if (sym) applySymmetry(f, w, h);
  return f;
}

class Puzzle {
  constructor({ sleep: s }) { this.sl = s; this.reset(); }
  reset() {
    this.st = 'INTRO';
    this.S = this.ri(-100, 99);
    this.F = this.ri(1, 700);
    this.s2 = this.ri(-100, 99);
    while (this.s2 === this.S) this.s2 = this.ri(-100, 99);
    
    this.c = Array.from({ length: 15 }, () => {
      let k = this.ri(-10, 9) || 1;
      return { k, k2: this.F - this.S * k, q: 0 };
    });
    this.sel = this.pq = null;
    this.calcQ();
  }
  ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  calcQ() { this.c.forEach(x => x.q = this.s2 * x.k + x.k2); }
  dv(i) { let x = this.c[i]; return this.sel === i && this.pq != null ? this.pq : x.q; }
  select(i) { this.sel = i; this.pq = this.c[i].q; }
  cp(d) { return this.sel != null ? (this.pq += d, !0) : !1; }
  get solved() { return this.s2 === this.S; }

  async confirm({ update: u, view: v, setFrame: s, magic: m, win: w }) {
    const i = this.sel, x = this.c[i], n = this.pq;
    this.s2 = Math.trunc((n - x.k2) / x.k);
    this.sel = this.pq = null;
    x.q = n;
    
    this.st = 'UNICORN_ANIM';
    u();
    await v('unicorn');
    await this.sl(950);
    s(0, 0); await this.sl(550);
    s(1, 0); await this.sl(500);
    s(2, 1); m();
    this.calcQ();
    u();
    await this.sl(850);
    s(1, 0); await this.sl(500);
    s(0, 0); await this.sl(550);
    await v('table'); u();
    await this.sl(950);
    
    this.st = this.solved ? 'WIN' : 'PLAYING';
    if (this.solved) { await v('unicorn'); await this.sl(950); w(); } else u();
  }
}

function drawTable() {

  const c = cv.getContext('2d'); c.scale(d, d);

  c.fillStyle = lg; c.fillRect(0, 0, w, h);

function render() {
  const play = puzzle.st === 'PLAYING';
  const tv = view === 'table';
  const sel = puzzle.sel != null;
  show(ui.bottom, tv && puzzle.st !== 'STARTING');
  show(ui.idleHints, play && !sel);
  show(ui.selectedHints, play && sel);
  ui.turnStatus.hidden = puzzle.st !== 'UNICORN_ANIM' || view !== 'unicorn';
  show(ui.restart, puzzle.st !== 'INTRO');
  ui.restart.disabled = !/PLAYING|WIN/.test(puzzle.st);
  ui.help.disabled = !/INTRO|PLAYING|WIN/.test(puzzle.st);
  ui.grid.inert = !play;
  stacks.forEach((s, i) => (s.btn.disabled = !play, drawStack(i)));
  if (sel) {
    const b = puzzle.c[puzzle.sel].q, a = puzzle.pq, d = a - b;
    ui.oldValue.textContent = num(b);
    ui.newValue.textContent = num(a);
    ui.confirm.disabled = d === 0;
    ui.confirmHint.textContent = d ? 'Click the stack again.' : 'Wheel or − / + will change the number.';
  }
}

  puzzle.cp(d) && render();
}

function startHold(d) {
  if (puzzle.st !== 'PLAYING' || puzzle.sel == null) return;
  stopHoldFn?.();
  let hd = 240, ht;
  doStep(d);
  const tick = () => {
    doStep(d);
    hd = Math.max(30, hd * .96);
    ht = setTimeout(tick, hd);
  };
  ht = setTimeout(tick, hd);
  return () => clearTimeout(ht);

async function newGame() {
  if (!/INTRO|PLAYING|WIN/.test(puzzle.st)) return;
  unlockAudio();
  puzzle.reset();
  puzzle.st = 'STARTING';
  [ui.intro, ui.startActions, ui.winPanel].forEach(e => show(e, 0));
  setFrame(0, 0);
  render();
  await dl(500);
  await lookAt('table');
  puzzle.st = 'PLAYING';
  render();
  stacks[0].btn.focus({ preventScroll: 1 });
}

async function confirmMove() {
  if (puzzle.st !== 'PLAYING' || puzzle.sel == null) return;
  if (puzzle.pq === puzzle.c[puzzle.sel].q) return;
  unlockAudio();
  await puzzle.confirm({
    update: render, view: lookAt, setFrame, magic: magicSound,
    win: () => { show(ui.winPanel, 1); show(ui.startActions, 1); ui.newGame.focus({ preventScroll: 1 }); }
  });
  puzzle.st === 'PLAYING' && render();
}

function onStackClick(i) {
  if (puzzle.st !== 'PLAYING') return;
  puzzle.sel === i ? confirmMove() : (puzzle.select(i), render());
}

ui.newGame.onclick = ui.restart.onclick = newGame;
ui.confirm.onclick = confirmMove;

const btnDec = $('.decrease'), btnInc = $('.increase');
const stopHold = () => stopHoldFn && (stopHoldFn(), stopHoldFn = null);
[btnDec, btnInc].forEach(b => {
  const d = b.classList.contains('decrease') ? -1 : 1;
  b.onpointerdown = e => { e.preventDefault(); stopHold(); stopHoldFn = startHold(d); };
  b.onpointerup = b.onpointerleave = stopHold;
});

ui.stage.addEventListener('wheel', e => {
  if (ui.dialog.open || puzzle.st !== 'PLAYING' || puzzle.sel == null || !e.deltaY || e.ctrlKey) return;
  e.preventDefault();
  const t = performance.now();
  if (t - wt < 55) return;
  wt = t;
  doStep(e.deltaY > 0 ? -1 : 1);
}, { passive: 0 });

ui.help.onclick = () => { ui.dialog.showModal(); render(); };
$('.close-help').onclick = $('.understood').onclick = () => ui.dialog.close();
ui.dialog.onclose = render;

document.onkeydown = e => {
  if (ui.dialog.open || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') return /PLAYING|WIN/.test(puzzle.st) && (e.preventDefault(), newGame());
  if (puzzle.st !== 'PLAYING') return;
  if ((k === 'enter' || k === ' ') && !e.target.closest('button')) return e.preventDefault(), confirmMove();
  if (/[+=\-_]/.test(k)) return e.preventDefault(), doStep(k === '-' || k === '_' ? -1 : 1);

  if (D[k]) {
    e.preventDefault();
    let i = puzzle.sel;
    if (i == null) i = 0;
    else {
      const [dr, dc] = D[k];
      const r = Math.max(0, Math.min(2, Math.floor(i / 5) + dr));
      const c = Math.max(0, Math.min(4, i % 5 + dc));
      i = r * 5 + c;
    }
    if (i !== puzzle.sel) puzzle.select(i);
    stacks[i].btn.focus({ preventScroll: 1 });
    render();
  }
};

let rf;
onresize = () => {
  cancelAnimationFrame(rf);
  rf = requestAnimationFrame(() => { drawTable(); render(); });
};

UnicornAnim.init();
drawTable();
render();
document.documentElement.dataset.gameReady = 1;
