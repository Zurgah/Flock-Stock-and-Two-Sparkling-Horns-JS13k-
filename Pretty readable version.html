  // =========================================================================
  // PAK DECODER - Unicorn Animation
  // =========================================================================
  const POPCOUNT_TABLE = new Uint8Array(256);
  for (let i = 0; i < 256; i++) {
    POPCOUNT_TABLE[i] = (i & 1) + POPCOUNT_TABLE[i >> 1];
  }

  class Reader {
    constructor(buffer) {
      this.buffer = new DataView(buffer);
      this.pos = 0;
      this.length = buffer.byteLength;
    }
    
    u8() {
      return this.buffer.getUint8(this.pos++);
    }
    
    u16() {
      const value = this.buffer.getUint16(this.pos, true);
      this.pos += 2;
      return value;
    }
    
    bytes(n) {
      if (this.pos + n > this.length) {
        n = this.length - this.pos;
      }
      if (n < 1) {
        return new Uint8Array();
      }
      this.pos += n;
      return new Uint8Array(this.buffer.buffer, this.buffer.byteOffset + this.pos - n, n);
    }
  }

  function unpackBits(data, count, bits, output) {
    let buffer = 0, bitsInBuffer = 0, inputIndex = 0, outputIndex = 0;
    const mask = (1 << bits) - 1;
    
    while (outputIndex < count && inputIndex < data.length) {
      while (bitsInBuffer < bits && inputIndex < data.length) {
        buffer = (buffer << 8) | data[inputIndex++];
        bitsInBuffer += 8;
      }
      if (bitsInBuffer >= bits) {
        bitsInBuffer -= bits;
        output[outputIndex++] = (buffer >> bitsInBuffer) & mask;
        buffer &= (1 << bitsInBuffer) - 1;
      }
    }
    return outputIndex;
  }

  function applySymmetry(frame, width, height) {
    for (let y = 0; y < height; y++) {
      const rowStart = y * width;
      for (let x = 0; x < width >> 1; x++) {
        frame[rowStart + width - 1 - x] = frame[rowStart + x];
      }
    }
  }

  function decodeFrame(reader, prevFrame, width, height, palette, bits, outputFrame) {
    const sym = reader.u8();
    const type = reader.u8();
    const totalPixels = width * height;
    const frame = outputFrame || new Uint8Array(totalPixels);

    // Type 0xFF: Copy previous frame or clear
    if (type === 255) {
      if (prevFrame) {
        frame.set(prevFrame);
      } else {
        frame.fill(0);
      }
      return frame;
    }

    const dataSize = reader.u16();
    const data = reader.bytes(dataSize);

    // Type 0: Unpack bits
    if (type === 0) {
      const pixelCount = sym ? (width >> 1) * height : totalPixels;
      unpackBits(data, pixelCount, bits, frame);
    }
    // Type 1: RLE encoding
    else if (type === 1) {
      frame.fill(0);
      let pixelIndex = 0, byteIndex = 0, bitBuffer = 0, bitsInBuffer = 0;
      const mask = (1 << bits) - 1;
      
      while (pixelIndex < totalPixels && byteIndex < data.length) {
        while (bitsInBuffer < bits && byteIndex < data.length) {
          bitBuffer = (bitBuffer << 8) | data[byteIndex++];
          bitsInBuffer += 8;
        }
        if (bitsInBuffer < bits) break;
        bitsInBuffer -= bits;
        const value = (bitBuffer >> bitsInBuffer) & mask;
        bitBuffer &= (1 << bitsInBuffer) - 1;
        
        while (bitsInBuffer < 8 && byteIndex < data.length) {
          bitBuffer = (bitBuffer << 8) | data[byteIndex++];
          bitsInBuffer += 8;
        }
        if (bitsInBuffer < 8) break;
        bitsInBuffer -= 8;
        const count = (bitBuffer >> bitsInBuffer) & 255;
        bitBuffer &= (1 << bitsInBuffer) - 1;
        
        if (!count) break;
        const end = Math.min(pixelIndex + count, totalPixels);
        for (; pixelIndex < end; frame[pixelIndex++] = value);
      }
    }
    // Type 2: Delta encoding with mask
    else if (type === 2) {
      if (prevFrame) {
        frame.set(prevFrame);
      } else {
        frame.fill(0);
      }
      const maskSize = data[0] | (data[1] << 8);
      const mask = data.subarray(2, 2 + maskSize);
      const packed = data.subarray(2 + maskSize);
      
      let diffCount = 0;
      for (let i = 0; i < maskSize;) {
        diffCount += POPCOUNT_TABLE[mask[i++]];
      }
      
      const changed = new Uint8Array(diffCount);
      unpackBits(packed, diffCount, bits, changed);
      
      let changedIndex = 0, pixelIndex = 0;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const byteIndex = pixelIndex >> 3;
          const bitIndex = 7 - (pixelIndex & 7);
          if (byteIndex < maskSize && (mask[byteIndex] >> bitIndex) & 1 && changedIndex < diffCount) {
            frame[pixelIndex] = changed[changedIndex++];
          }
          pixelIndex++;
        }
      }
    }
    // Type 3: Rectangle update
    else if (type === 3) {
      if (prevFrame) {
        frame.set(prevFrame);
      } else {
        frame.fill(0);
      }
      const x0 = data[0] | (data[1] << 8);
      const y0 = data[2] | (data[3] << 8);
      const x1 = data[4] | (data[5] << 8);
      const y1 = data[6] | (data[7] << 8);
      const packedSize = data[8] | (data[9] << 8);
      const packed = data.subarray(10, 10 + packedSize);
      
      const boxWidth = x1 - x0 + 1;
      const boxHeight = y1 - y0 + 1;
      const indices = new Uint8Array(boxWidth * boxHeight);
      unpackBits(packed, boxWidth * boxHeight, bits, indices);
      
      let index = 0;
      for (let y = y0; y <= y1; y++) {
        const rowStart = y * width;
        for (let x = x0; x <= x1; x++) {
          if (index < indices.length) {
            frame[rowStart + x] = indices[index++];
          }
        }
      }
    }

    if (sym) {
      applySymmetry(frame, width, height);
    }
    return frame;
  }

  // =========================================================================
  // PUZZLE GAME LOGIC
  // =========================================================================
  class Puzzle {
    constructor({ sleep: sleepFn }) {
      this.sleep = sleepFn;
      this.reset();
    }
    
    reset() {
      this.state = 'INTRO';
      this.targetSlope = this.randomInt(-100, 99);
      this.targetValue = this.randomInt(1, 700);
      this.currentSlope = this.randomInt(-100, 99);
      
      // Ensure currentSlope !== targetSlope
      while (this.currentSlope === this.targetSlope) {
        this.currentSlope = this.randomInt(-100, 99);
      }
      
      // Generate 15 cells (3x5 grid)
      this.cells = Array.from({ length: 15 }, () => {
        let slope = this.randomInt(-10, 9) || 1;
        return {
          slope: slope,
          intercept: this.targetValue - this.targetSlope * slope,
          currentValue: 0
        };
      });
      
      this.selectedCell = null;
      this.pendingValue = null;
      this.calculateValues();
    }
    
    randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    
    calculateValues() {
      this.cells.forEach(cell => {
        cell.currentValue = this.currentSlope * cell.slope + cell.intercept;
      });
    }
    
    getDisplayValue(index) {
      const cell = this.cells[index];
      return (this.selectedCell === index && this.pendingValue !== null) 
        ? this.pendingValue 
        : cell.currentValue;
    }
    
    select(index) {
      this.selectedCell = index;
      this.pendingValue = this.cells[index].currentValue;
    }
    
    adjust(delta) {
      if (this.selectedCell === null) return false;
      this.pendingValue += delta;
      return true;
    }
    
    get isSolved() {
      return this.currentSlope === this.targetSlope;
    }

    async confirm({ update, view, setFrame, magic, win }) {
      const cellIndex = this.selectedCell;
      const cell = this.cells[cellIndex];
      const newValue = this.pendingValue;
      
      // Calculate new slope
      this.currentSlope = Math.trunc((newValue - cell.intercept) / cell.slope);
      this.selectedCell = null;
      this.pendingValue = null;
      cell.currentValue = newValue;
      
      // Unicorn animation sequence
      this.state = 'UNICORN_ANIM';
      update();
      
      await view('unicorn');
      await this.sleep(950);
      
      setFrame(0, false);
      await this.sleep(550);
      
      setFrame(1, false);
      await this.sleep(500);
      
      setFrame(2, true);
      magic();
      
      this.calculateValues();
      update();
      
      await this.sleep(850);
      
      setFrame(1, false);
      await this.sleep(500);
      
      setFrame(0, false);
      await this.sleep(550);
      
      await view('table');
      update();
      
      await this.sleep(950);
      
      // Check win condition
      this.state = this.isSolved ? 'WIN' : 'PLAYING';
      if (this.isSolved) {
        await view('unicorn');
        await this.sleep(950);
        win();
      } else {
        update();
      }
    }
  }

  // =========================================================================
  // TABLE RENDERING
  // =========================================================================
  function drawTable() {
    const canvas = $('.table-surface');
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    
    if (!width || !height) return;
    
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    
    ctx.save();
    
    // Clip to table shape
    ctx.beginPath();
    ctx.moveTo(width * 0.1, 4);
    ctx.lineTo(width * 0.9, 4);
    ctx.lineTo(width * 1.2, height);
    ctx.lineTo(-width * 0.2, height);
    ctx.closePath();
    ctx.clip();
    
    // Base color
    ctx.fillStyle = '#70452a';
    ctx.fillRect(0, 0, width, height);
    
    // Gradient overlay
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#150e187a');
    gradient.addColorStop(0.5, '#5c363159');
    gradient.addColorStop(1, '#180f176b');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    
    // Wood grain lines
    const halfWidth = width / 2;
    for (let i = 0; i < 8; i++) {
      const x = width * i / 7;
      ctx.beginPath();
      ctx.moveTo(halfWidth + (x - halfWidth) * 0.8, 0);
      ctx.lineTo(halfWidth + (x - halfWidth) * 1.4, height);
      ctx.strokeStyle = '#200f1033';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    ctx.restore();
    
    // Top edge highlight
    ctx.beginPath();
    ctx.moveTo(width * 0.1, 4);
    ctx.lineTo(width * 0.9, 4);
    ctx.strokeStyle = '#d9a06a99';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  const stackColors = ['#e2635c', '#ed9e4b', '#e4c45b', '#70af72', '#63b5b7', '#6589cd', '#9876c3'];
  
  const stacks = Array.from({ length: 15 }, (_, index) => {
    const button = document.createElement('button');
    button.className = 'stack';
    button.type = 'button';
    button.onclick = () => onStackClick(index);
    
    const canvas = document.createElement('canvas');
    button.append(canvas);
    ui.grid.append(button);
    
    return { button, canvas };
  });

  function drawStack(index) {
    const { button, canvas } = stacks[index];
    const width = button.clientWidth;
    const height = button.clientHeight;
    
    if (!width || !height || !puzzle.cells[index]) return;
    
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    
    const scale = Math.min(width / 152, height / 150);
    ctx.translate(width / 2, height / 2);
    ctx.scale(scale, scale);
    
    const isSelected = puzzle.selectedCell === index;
    const isDimmed = puzzle.selectedCell !== null && !isSelected;
    
    if (isDimmed) {
      ctx.globalAlpha = 0.35;
      ctx.filter = 'grayscale(100%)';
    }
    
    const TWO_PI = Math.PI * 2;

    ctx.shadowBlur = 0;
    
    // Draw 7 colored rings
    for (let ring = 6; ring >= 0; ring--) {
      const y = -28 + ring * 10;
      
      // Ring gradient
      const gradient = ctx.createLinearGradient(-59, y, 59, y);
      gradient.addColorStop(0, stackColors[ring]);
      gradient.addColorStop(0.32, stackColors[ring]);
      gradient.addColorStop(1, '#30213e');
      ctx.fillStyle = gradient;
      
      // Ring body
      ctx.beginPath();
      ctx.rect(-58, y - 2, 116, 12);
      ctx.fill();
      
      // Ring bottom ellipse

      ctx.ellipse(0, y + 8, 58, 18, 0, 0, TWO_PI);
      ctx.fill();
      
      // Ring top ellipse
      ctx.beginPath();
      ctx.ellipse(0, y, 58, 18, 0, 0, TWO_PI);
      ctx.fillStyle = stackColors[ring];
      ctx.fill();
      
      // Ring highlight
      ctx.beginPath();
      ctx.ellipse(0, y, 58, 18, 0, 0.09, Math.PI - 0.09);
      ctx.strokeStyle = '#ffffff26';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.ellipse(0, -39, 59, 23, 0, 0, TWO_PI);

    ctx.ellipse(0, -39, 53, 18, 0, 0, TWO_PI);
    ctx.strokeStyle = isSelected ? '#cb7f3b' : '#977a4c55';
    ctx.lineWidth = isSelected ? 1.5 : 0.9;
    ctx.stroke();

    ctx.fillStyle = '#241a20';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, -38, 102);

  // =========================================================================
  // UI RENDERING
  // =========================================================================
  function render() {
    const isPlaying = puzzle.state === 'PLAYING';
    const isTableView = currentView === 'table';
    const hasSelection = puzzle.selectedCell !== null;
    
    showElement(ui.bottom, isTableView && puzzle.state !== 'STARTING');
    showElement(ui.idleHints, isPlaying && !hasSelection);
    showElement(ui.selectedHints, isPlaying && hasSelection);
    
    ui.turnStatus.hidden = puzzle.state !== 'UNICORN_ANIM' || currentView !== 'unicorn';
    showElement(ui.restart, puzzle.state !== 'INTRO');
    
    ui.restart.disabled = !/PLAYING|WIN/.test(puzzle.state);
    ui.help.disabled = !/INTRO|PLAYING|WIN/.test(puzzle.state);
    
    ui.grid.inert = !isPlaying;
    
    stacks.forEach((stack, index) => {
      stack.button.disabled = !isPlaying;
      drawStack(index);
    });
    
    if (hasSelection) {
      const oldValue = puzzle.cells[puzzle.selectedCell].currentValue;
      const newValue = puzzle.pendingValue;
      const diff = newValue - oldValue;
      
      ui.oldValue.textContent = formatNumber(oldValue);
      ui.newValue.textContent = formatNumber(newValue);
      ui.confirm.disabled = diff === 0;
      ui.confirmHint.textContent = diff 
        ? 'Click the stack again.' 
        : 'Wheel or − / + will change the number.';
    }
  }

  function lookAt(destination) {
    currentView = destination;
    ui.world.classList.toggle('look-table', destination === 'table');
    render();
    return sleep(950);
  }

  function setFrame(index, glow) {
    UnicornAnim.drawFrame(index);
    ui.opponent.classList.toggle('is-magic', glow);
    ui.stage.classList.toggle('magic', glow);
  }

  // =========================================================================
  // AUDIO
  // =========================================================================
  function unlockAudio() {
    const AudioContextClass = AudioContext || webkitAudioContext;
    if (!AudioContextClass) return;
    
    try {
      audioContext ??= new AudioContextClass();
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    } catch {}
  }

  function magicSound() {
    if (!audioContext || audioContext.state !== 'running') return;
    
    const startTime = audioContext.currentTime;
    
    const voices = [
      [0, 'sine', 0.1, 1.03, [[0, 180], [0.4, 2400], [1, 250]]],
      [0.05, 'triangle', 0.043, 0.93, [[0, 1100], [0.82, 4500]]],
      [0.18, 'sine', 0.032, 0.81, [[0, 3200], [0.68, 7000]]]
    ];
    
    voices.forEach(([delay, type, gain, endTime, notes]) => {
      const noteStart = startTime + delay;
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.type = type;
      
      notes.forEach(([time, frequency], noteIndex) => {
        if (noteIndex === 0) {
          oscillator.frequency.setValueAtTime(frequency, noteStart + time);
        } else {
          oscillator.frequency.exponentialRampToValueAtTime(frequency, noteStart + time);
        }
      });
      
      gainNode.gain.setValueAtTime(0, noteStart);
      gainNode.gain.linearRampToValueAtTime(gain, noteStart + 0.04);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, noteStart + endTime);
      
      oscillator.connect(gainNode).connect(audioContext.destination);
      oscillator.start(noteStart);
      oscillator.stop(noteStart + endTime + 0.02);
      
      oscillator.onended = () => {
        oscillator.disconnect();
        gainNode.disconnect();
      };
    });
  }

  // =========================================================================
  // GAME CONTROL FUNCTIONS
  // =========================================================================
  
  function doStep(delta) {
    if (puzzle.adjust(delta)) {
      render();
    }
  }

  let stopHoldFunction;
  
  function startHold(delta) {
    if (puzzle.state !== 'PLAYING' || puzzle.selectedCell === null) return;
    
    if (stopHoldFunction) {
      stopHoldFunction();
    }
    
    let holdDelay = 240;
    let holdTimer;
    
    doStep(delta);
    
    const tick = () => {
      doStep(delta);
      holdDelay = Math.max(30, holdDelay * 0.96);
      holdTimer = setTimeout(tick, holdDelay);
    };
    
    holdTimer = setTimeout(tick, holdDelay);
    
    return () => {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
    };
  }

  async function newGame() {
    if (!/INTRO|PLAYING|WIN/.test(puzzle.state)) return;
    
    unlockAudio();
    puzzle.reset();
    puzzle.state = 'STARTING';
    
    showElement(ui.intro, false);
    showElement(ui.startActions, false);
    showElement(ui.winPanel, false);
    setFrame(0, false);
    
    render();
    await sleep(500);
    await lookAt('table');
    
    puzzle.state = 'PLAYING';
    render();
    
    stacks[0].button.focus({ preventScroll: true });
  }

  async function confirmMove() {
    if (puzzle.state !== 'PLAYING' || puzzle.selectedCell === null) return;
    
    const cell = puzzle.cells[puzzle.selectedCell];
    if (puzzle.pendingValue === cell.currentValue) return;
    
    unlockAudio();
    
    await puzzle.confirm({
      update: render,
      view: lookAt,
      setFrame: setFrame,
      magic: magicSound,
      win: () => {
        showElement(ui.winPanel, true);
        showElement(ui.startActions, true);
        ui.newGame.focus({ preventScroll: true });
      }
    });
    
    if (puzzle.state === 'PLAYING') {
      render();
    }
  }

  function onStackClick(index) {
    if (puzzle.state !== 'PLAYING') return;
    
    if (puzzle.selectedCell === index) {
      confirmMove();
    } else {
      puzzle.select(index);
      render();
    }
  }

  // =========================================================================
  // EVENT HANDLERS
  // =========================================================================
  
  // Button click handlers
  ui.newGame.onclick = newGame;
  ui.restart.onclick = newGame;
  ui.confirm.onclick = confirmMove;

  // Hold buttons (+/-)
  const decreaseButton = $('.decrease');
  const increaseButton = $('.increase');
  
  const stopHold = () => {
    if (stopHoldFunction) {
      stopHoldFunction();
      stopHoldFunction = null;
    }
  };
  
  [decreaseButton, increaseButton].forEach(button => {
    const delta = button.classList.contains('decrease') ? -1 : 1;
    
    button.onpointerdown = event => {
      event.preventDefault();
      stopHold();
      stopHoldFunction = startHold(delta);
    };
    
    button.onpointerup = stopHold;
    button.onpointerleave = stopHold;
  });

  // Mouse wheel handler
  ui.stage.addEventListener('wheel', event => {
    if (ui.dialog.open || puzzle.state !== 'PLAYING' || puzzle.selectedCell === null || !event.deltaY || event.ctrlKey) {
      return;
    }
    
    event.preventDefault();
    
    const now = performance.now();
    if (now - lastWheelTime < 55) return;
    lastWheelTime = now;
    
    doStep(event.deltaY > 0 ? -1 : 1);
  }, { passive: false });

  // Help dialog handlers
  ui.help.onclick = () => {
    ui.dialog.showModal();
    render();
  };
  
  $('.close-help').onclick = () => ui.dialog.close();
  $('.understood').onclick = () => ui.dialog.close();
  ui.dialog.onclose = render;

  // Keyboard handler
  document.onkeydown = event => {
    if (ui.dialog.open || event.ctrlKey || event.metaKey || event.altKey) return;
    
    const key = event.key.toLowerCase();
    
    // R - new game
    if (key === 'r') {
      if (/PLAYING|WIN/.test(puzzle.state)) {
        event.preventDefault();
        newGame();
      }
      return;
    }
    
    if (puzzle.state !== 'PLAYING') return;
    
    // Enter/Space - confirm move
    if ((key === 'enter' || key === ' ') && !event.target.closest('button')) {
      event.preventDefault();
      confirmMove();
      return;
    }
    
    // +/- keys - adjust value
    if (/[+=\-_]/.test(key)) {
      event.preventDefault();
      doStep(key === '-' || key === '_' ? -1 : 1);
      return;
    }
    
    // Arrow keys / WASD - navigate
    const directions = {
      arrowup: [-1, 0], w: [-1, 0],
      arrowdown: [1, 0], s: [1, 0],
      arrowleft: [0, -1], a: [0, -1],
      arrowright: [0, 1], d: [0, 1]
    };
    
    if (directions[key]) {
      event.preventDefault();
      
      let index = puzzle.selectedCell;
      
      if (index === null) {
        index = 0;
      } else {
        const [deltaRow, deltaCol] = directions[key];
        const row = Math.max(0, Math.min(2, Math.floor(index / 5) + deltaRow));
        const col = Math.max(0, Math.min(4, index % 5 + deltaCol));
        index = row * 5 + col;
      }
      
      if (index !== puzzle.selectedCell) {
        puzzle.select(index);
      }
      
      stacks[index].button.focus({ preventScroll: true });
      render();
    }
  };

  // Resize handler
  let resizeFrame;
  window.onresize = () => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      drawTable();
      render();
    });
  };

  // =========================================================================
  // INITIALIZATION
  // =========================================================================
  
  UnicornAnim.init();
  drawTable();
  render();
  document.documentElement.dataset.gameReady = '1';

})();

    let phaseOctave = phase;
    let filterOutput = 0;
    const filterDecay = sampleRate * WAH_SPEED;
    
    for (let k = 0; k < duration; k++) {
      let sample = 0;
      
      if (event.waveform === 2) {
        sample = Math.random() * 2 - 1;
      } else {
        for (let i = 0; i < 6; i++) {
          sample += sawtooth(phase * (1 + DETUNE[i]));
        }
        sample /= 6;
        sample += sawtooth(phase) * 0.5;
        sample += sawtooth(phaseOctave) * 0.3;
        
        phase += phaseStep;
        if (phase > 6.28318) phase -= 6.28318;
        
        phaseOctave += phaseStepOctave;
        if (phaseOctave > 6.28318) phaseOctave -= 6.28318;
      }
      
      const cutoff = WAH_END + (WAH_START - WAH_END) * Math.exp(-k / filterDecay);
      const alpha = 1 - Math.exp(-6.28318 * cutoff / sampleRate);
      filterOutput += alpha * (sample - filterOutput);
      sample = filterOutput;
      
      let envelope = 0;
      if (k < attackLength) {
        envelope = k / attackLength;
      } else if (k < attackLength + decayLength) {
        envelope = 1 - (1 - SUS) * (k - attackLength) / decayLength;
      } else if (k < attackLength + decayLength + sustainLength) {
        envelope = SUS;
      } else {
        envelope = SUS * (1 - (k - attackLength - decayLength - sustainLength) / releaseLength);
      }
      
      output[startTime + k] += sample * envelope * event.amplitude;
    }
  }
  
  applyDistortion(output, SAT_DRIVE);
  lowpassFilter(output, sampleRate, 7500, 0.6);
  highpassFilter(output, sampleRate, 40);
  
  let maxAmplitude = 0;
  for (let k = 0; k < length; k++) {
    const amplitude = Math.abs(output[k]);
    if (amplitude > maxAmplitude) maxAmplitude = amplitude;
  }
  
  if (maxAmplitude) {
    const gain = 0.85 / maxAmplitude;
    for (let k = 0; k < length; k++) {
      let sample = output[k] * gain;
      if (sample > 1) sample = 1;
      if (sample < -1) sample = -1;
      output[k] = sample;
    }
  }
  
  for (const event of data.events) {
    if (event.waveform !== 2) continue;
    
    const startTime = event.time * sampleRate | 0;
    const duration = Math.min(length - startTime, event.duration * sampleRate | 0, sampleRate * 10);
    
    if (duration < 1) continue;
    
    for (let k = 0; k < duration; k++) {
      const envelope = Math.exp(-D_DEC_RATE * k / duration);
      const noise = (Math.random() * 2 - 1) * envelope * event.amplitude * D_AMP;
      output[startTime + k] += noise;
      
      if (output[startTime + k] > 1) output[startTime + k] = 1;
      if (output[startTime + k] < -1) output[startTime + k] = -1;
    }
  }
  
  return { sampleRate, buffer: output };
}

async function playMusic(data) {
  const rendered = renderMusic(data);
  const context = new AudioContext();
  audioCtxMusic = context;
  
  await context.resume();
  
  const buffer = context.createBuffer(1, rendered.buffer.length, rendered.sampleRate);
  buffer.copyToChannel(rendered.buffer, 0);
  
  const source = context.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  source.connect(context.destination);
  source.start();
}
